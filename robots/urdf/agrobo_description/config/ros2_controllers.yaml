# ros2_control for the Agrobo HM-1 harvester (Gazebo via gz_ros2_control; same names on the real robot).
controller_manager:
  ros__parameters:
    update_rate: 200
    use_sim_time: true
    joint_state_broadcaster: {type: joint_state_broadcaster/JointStateBroadcaster}
    base_controller: {type: diff_drive_controller/DiffDriveController}
    left_arm_controller: {type: joint_trajectory_controller/JointTrajectoryController}
    right_arm_controller: {type: joint_trajectory_controller/JointTrajectoryController}
    left_gripper_controller: {type: forward_command_controller/ForwardCommandController}
    right_gripper_controller: {type: forward_command_controller/ForwardCommandController}

base_controller:
  ros__parameters:
    left_wheel_names: [front_left_wheel_joint, rear_left_wheel_joint]
    right_wheel_names: [front_right_wheel_joint, rear_right_wheel_joint]
    wheel_separation: 0.58
    wheel_radius: 0.254
    wheel_separation_multiplier: 1.35   # skid-steer slip; calibrate on the test field
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    cmd_vel_timeout: 0.5
    linear.x.max_velocity: 1.5
    linear.x.max_acceleration: 0.8
    angular.z.max_velocity: 1.0
    angular.z.max_acceleration: 1.5

left_arm_controller:
  ros__parameters:
    joints: [left_arm_shoulder_pan_joint, left_arm_shoulder_lift_joint, left_arm_elbow_joint,
             left_arm_wrist_1_joint, left_arm_wrist_2_joint, left_arm_wrist_3_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

right_arm_controller:
  ros__parameters:
    joints: [right_arm_shoulder_pan_joint, right_arm_shoulder_lift_joint, right_arm_elbow_joint,
             right_arm_wrist_1_joint, right_arm_wrist_2_joint, right_arm_wrist_3_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

left_gripper_controller:
  ros__parameters:
    joints: [left_ee_finger_1_joint, left_ee_finger_2_joint, left_ee_finger_3_joint, left_ee_suction_joint]
    interface_name: position

right_gripper_controller:
  ros__parameters:
    joints: [right_ee_finger_1_joint, right_ee_finger_2_joint, right_ee_finger_3_joint, right_ee_suction_joint]
    interface_name: position
