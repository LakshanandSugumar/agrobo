<!doctype html>
<html><head><meta charset="utf-8"><title>Agrobo Film v3</title>
<style>
@font-face{font-family:Corm;font-weight:300;src:url(fonts/Cormorant-Light.ttf)}
@font-face{font-family:Corm;font-weight:300;font-style:italic;src:url(fonts/Cormorant-LightItalic.ttf)}
@font-face{font-family:Corm;font-weight:500;src:url(fonts/Cormorant-Medium.ttf)}
@font-face{font-family:JBM;font-weight:400;src:url(fonts/JBMono-Regular.ttf)}
@font-face{font-family:JBM;font-weight:600;src:url(fonts/JBMono-SemiBold.ttf)}
@font-face{font-family:Int;font-weight:300;src:url(fonts/Inter-Light.otf)}
@font-face{font-family:Int;font-weight:400;src:url(fonts/Inter-Regular.otf)}
@font-face{font-family:Int;font-weight:500;src:url(fonts/Inter-Medium.otf)}
@font-face{font-family:Int;font-weight:600;src:url(fonts/Inter-SemiBold.otf)}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style>
<script src="data.js"></script>
<script src="v3/frames/plates.js"></script>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Agrobo film: every frame is a pure function of time t (seconds) -> render(t).
const W = 1920, H = 1080, LB = 131, DUR = 86;
const C = document.getElementById('c'); let ctx = C.getContext('2d');
const S = window.SIM;

// ---------- helpers ----------
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const eback = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const fade = (u, a, b, fi = .7, fo = .6) => Math.min(seg(u, a, a + fi), 1 - seg(u, b - fo, b));
function hx(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, t, al = 1) { const A = hx(a), B = hx(b); return `rgba(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')},${al})`; }
function rgba(h, a) { return `rgba(${hx(h).join(',')},${a})`; }
const fmt = n => Math.round(n).toLocaleString('en-US');
const P = { gold: '#d6b56d', gold2: '#f3dea4', cream: '#f2ecdf', green: '#2f8f5b', leaf: '#3d8a45', red: '#d9361f', cyan: '#8be6ff', water: '#58c4ff', ink: '#050807' };
const SERIF = (w, s, it) => `${it ? 'italic ' : ''}${w} ${s}px Corm`;
const MONO = (s, w = 400) => `${w} ${s}px JBM`;
const SANS = (s, w = 400) => `${w} ${s}px Int`;

function txt(s, x, y, o = {}) {
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1); ctx.font = o.font || SERIF(300, 64); ctx.fillStyle = o.color || P.cream;
  ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic'; ctx.letterSpacing = (o.ls || 0) + 'px';
  if (o.glow) { ctx.shadowBlur = o.glow; ctx.shadowColor = o.glowColor || o.color || P.cream; }
  ctx.fillText(s, x, y); ctx.restore();
}
// rising, tracking-in text reveal
function reveal(s, x, y, u, a, b, o = {}) {
  const al = fade(u, a, b, o.fi ?? .8, o.fo ?? .6); if (al <= 0) return;
  const k = eout(seg(u, a, a + 1.2));
  txt(s, x, y + (1 - k) * 18, { ...o, alpha: al * (o.alpha ?? 1), ls: (o.ls || 0) + (1 - k) * 6 });
}
function caption(s, u, a, b, o = {}) { reveal(s, 140, 878, u, a, b, { font: SERIF(300, 58), glow: 18, glowColor: 'rgba(0,0,0,.9)', ...o }); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function softDot(x, y, r, col, a) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(col, a)); g.addColorStop(.7, rgba(col, a * .8)); g.addColorStop(1, rgba(col, 0)); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); }
function glowDot(x, y, r, col, a) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0)); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); }
function bokeh(u, seed, n, cols, al = 1) {
  const R = rng(seed);
  for (let i = 0; i < n; i++) {
    const x = R() * W, y = R() * H, r = 40 + R() * 150, c = cols[Math.floor(R() * cols.length)], a = (.05 + R() * .12) * al, sp = (R() - .5) * 14;
    softDot(x + sp * u, y + Math.sin(u * .4 + i) * 10, r, c, a);
  }
}
function hudRow(label, value, x, y, al, o = {}) {
  if (al <= 0) return;
  txt(label, x, y, { font: MONO(13), color: 'rgba(242,236,223,.55)', ls: 2.5, alpha: al, align: o.align || 'left' });
  txt(value, x, y + 34, { font: MONO(26, 600), color: o.color || P.cream, alpha: al, align: o.align || 'left' });
}
function shade(top = 1, bot = 1) {
  if (top) { const g = ctx.createLinearGradient(0, LB, 0, LB + 210); g.addColorStop(0, 'rgba(0,0,0,.72)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, LB, W, 210); }
  if (bot) { const g = ctx.createLinearGradient(0, H - LB - 230, 0, H - LB); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.72)'); ctx.fillStyle = g; ctx.fillRect(0, H - LB - 230, W, 230); }
}
function brackets(x, y, w, h, l, col, lw = 2, al = 1) {
  ctx.save(); ctx.globalAlpha *= al; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
  const pts = [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]];
  for (const [px, py, sx, sy] of pts) { ctx.moveTo(px + sx * l, py); ctx.lineTo(px, py); ctx.lineTo(px, py + sy * l); }
  ctx.stroke(); ctx.restore();
}

// ---------- precomputed textures ----------
function hash2(x, y, s) { let h = x * 374761393 + y * 668265263 + s * 982451653; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y, s) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi, s), hash2(xi + 1, yi, s), u), lerp(hash2(xi, yi + 1, s), hash2(xi + 1, yi + 1, s), u), v); }
function fbm(x, y, s, o = 5) { let a = .5, f = 1, t = 0; for (let i = 0; i < o; i++) { t += a * vnoise(x * f, y * f, s + i); a *= .5; f *= 2; } return t; }
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

let TERRAIN, WILD, TILLED, GRAIN = [], WORDMARK;
const MAPW = 2400, MAPH = 1400;
function buildTextures() {
  // satellite terrain (half res)
  TERRAIN = makeCanvas(1200, 700); { const c = TERRAIN.getContext('2d'), id = c.createImageData(1200, 700), d = id.data;
    for (let y = 0; y < 700; y++) for (let x = 0; x < 1200; x++) {
      const n = fbm(x / 140, y / 140, 3), m = fbm(x / 40, y / 40, 9, 3), r = fbm(x / 260 + 10, y / 260, 21, 3);
      let col = [lerp(46, 96, n), lerp(52, 84, n), lerp(30, 50, n)];           // dry soil
      const green = clamp((r - .45) * 4); col = col.map((v, i) => lerp(v, [36, 70, 38][i], green * .8));
      const river = Math.abs(fbm(x / 300, y / 300, 77, 3) - .5); if (river < .012) col = [40, 70, 80];
      col = col.map(v => v * (.85 + m * .3));
      const i = (y * 1200 + x) * 4; d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255; }
    c.putImageData(id, 0, 0); }
  // wild (uncleared) ground and tilled ground for prep scene
  WILD = makeCanvas(W, H); { const c = WILD.getContext('2d'), id = c.createImageData(W / 2, H / 2), d = id.data;
    for (let y = 0; y < H / 2; y++) for (let x = 0; x < W / 2; x++) { const n = fbm(x / 60, y / 60, 5), m = fbm(x / 8, y / 8, 6, 2), g = clamp((fbm(x / 90, y / 90, 31) - .42) * 3);
      const col = [lerp(58, 92, n), lerp(54, 80, n), lerp(34, 46, n)].map((v, i) => lerp(v, [52, 72, 36][i], g) * (.8 + m * .35)); const i = (y * W / 2 + x) * 4; d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255; }
    const t = makeCanvas(W / 2, H / 2); t.getContext('2d').putImageData(id, 0, 0); c.drawImage(t, 0, 0, W, H);
    const R = rng(44); for (let i = 0; i < 260; i++) { const x = R() * W, y = R() * H, r = 8 + R() * 26; for (let k = 0; k < 5; k++) { c.fillStyle = `rgba(${30 + R() * 20},${50 + R() * 30},${24 + R() * 10},.85)`; c.beginPath(); c.arc(x + (R() - .5) * r, y + (R() - .5) * r, r * (.4 + R() * .5), 0, 7); c.fill(); } }
    for (let i = 0; i < 120; i++) { c.fillStyle = `rgba(${120 + R() * 40},${112 + R() * 30},${96 + R() * 20},.8)`; c.beginPath(); c.ellipse(R() * W, R() * H, 3 + R() * 7, 2 + R() * 5, R() * 3, 0, 7); c.fill(); } }
  TILLED = makeCanvas(W, H); { const c = TILLED.getContext('2d'); c.fillStyle = '#3b2a1d'; c.fillRect(0, 0, W, H);
    const R = rng(7); for (let y = 0; y < H; y += 2) { const f = Math.sin(y / 3.2) * .5 + .5; c.fillStyle = `rgba(${70 + f * 30},${50 + f * 20},${34 + f * 12},1)`; c.fillRect(0, y, W, 2); }
    for (let i = 0; i < 12; i++) { const y = rowY(i); const g = c.createLinearGradient(0, y - 20, 0, y + 20); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, 'rgba(120,88,60,.55)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, y - 20, W, 40); }
    for (let i = 0; i < 9000; i++) { c.fillStyle = `rgba(${R() < .5 ? 20 : 140},${R() < .5 ? 14 : 110},${10 + R() * 40},${R() * .25})`; c.fillRect(R() * W, R() * H, 2, 2); } }
  for (let k = 0; k < 4; k++) { const g = makeCanvas(640, 360), c = g.getContext('2d'), id = c.createImageData(640, 360), R = rng(100 + k);
    for (let i = 0; i < id.data.length; i += 4) { const v = R() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } c.putImageData(id, 0, 0); GRAIN.push(g); }
}
const rowY = i => 236 + i * 56;

// ---------- scenes ----------
// S1: dawn over the rows
function sDawn(u, d) {
  const rise = eout(seg(u, 0, 7.2)), hy = 560, zoom = 1 + .07 * eio(seg(u, 0, 7));
  ctx.save(); ctx.translate(960, hy); ctx.scale(zoom, zoom); ctx.translate(-960, -hy);
  let g = ctx.createLinearGradient(0, 0, 0, hy);
  g.addColorStop(0, '#020308'); g.addColorStop(.55, mix('#070b16', '#1d2130', rise)); g.addColorStop(1, mix('#1a110c', '#c9783c', rise));
  ctx.fillStyle = g; ctx.fillRect(-200, -200, W + 400, hy + 200);
  const sy = lerp(650, 548, rise);
  glowDot(960, sy, 900, '#e9a45a', .55 * rise); glowDot(960, sy, 260, '#ffd9a0', .7 * rise);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, hy); ctx.clip(); ctx.fillStyle = mix('#ffb468', '#fff1d6', rise, rise); ctx.beginPath(); ctx.arc(960, sy, 44, 0, 7); ctx.fill(); ctx.restore();
  g = ctx.createLinearGradient(0, hy, 0, H); g.addColorStop(0, '#16180f'); g.addColorStop(1, '#020302');
  ctx.fillStyle = g; ctx.fillRect(-200, hy, W + 400, H - hy + 200);
  // perspective crop rows with a slow dolly
  const travel = u * .9;
  for (let i = -34; i <= 34; i++) {
    const shine = Math.exp(-Math.abs(i) / 9) * rise;
    ctx.strokeStyle = `rgba(${Math.round(lerp(40, 230, shine))},${Math.round(lerp(60, 170, shine))},${Math.round(lerp(40, 100, shine))},${.25 + .35 * shine})`;
    ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(960 + i * 1.2, hy); ctx.lineTo(960 + i * 210, hy + 640); ctx.stroke();
    for (let k = 0; k < 46; k++) {
      const z = k + 1 - (travel % 1); if (z < .55) continue;
      const y = hy + 640 / z / 1.0 * .55 + 0, x = 960 + i * 210 * .55 / z;
      if (y > H + 40) continue;
      const r = 26 / z;
      ctx.fillStyle = `rgba(${Math.round(18 + 40 * shine)},${Math.round(38 + 40 * shine)},${Math.round(20 + 10 * shine)},${clamp(1.4 - z / 40)})`;
      ctx.beginPath(); ctx.ellipse(x, y - r * .4, r * 1.1, r * .8, 0, 0, 7); ctx.fill();
      if (shine > .05) { ctx.fillStyle = `rgba(255,200,130,${.35 * shine * clamp(1.4 - z / 40)})`; ctx.beginPath(); ctx.ellipse(x, y - r * .9, r * .8, r * .25, 0, 0, 7); ctx.fill(); }
    }
  }
  g = ctx.createLinearGradient(0, hy - 60, 0, hy + 90); g.addColorStop(0, 'rgba(240,170,100,0)'); g.addColorStop(.5, `rgba(240,170,100,${.28 * rise})`); g.addColorStop(1, 'rgba(240,170,100,0)');
  ctx.fillStyle = g; ctx.fillRect(-200, hy - 60, W + 400, 150);
  const R = rng(5); for (let i = 0; i < 90; i++) { const x = R() * W, y = 150 + R() * 800, s = R(); const a = (.2 + .5 * s) * rise * (.5 + .5 * Math.sin(u * 2 + i));
    ctx.fillStyle = `rgba(255,220,160,${a})`; ctx.beginPath(); ctx.arc(x + u * 8 * (s - .5), y - u * 6 * s, .8 + s * 1.8, 0, 7); ctx.fill(); }
  ctx.restore();
  reveal('Everyone wants to own land.', 960, 360, u, .9, 3.7, { align: 'center', font: SERIF(300, 82), glow: 30, glowColor: 'rgba(0,0,0,.8)' });
  reveal('Almost no one wants to farm it.', 960, 360, u, 4.0, d, { align: 'center', font: SERIF(300, 82, 1), color: P.gold2, glow: 30, glowColor: 'rgba(0,0,0,.8)' });
}

// S2: the subscription
function sSubscribe(u, d) {
  ctx.fillStyle = '#060908'; ctx.fillRect(0, 0, W, H);
  bokeh(u, 12, 22, ['#2f8f5b', '#d6b56d', '#1b4d3a'], 1);
  const zoom = 1 + 2.2 * Math.pow(seg(u, 7.0, 8), 2);
  const px = 560, py = 170 + (1 - eout(seg(u, 0, 1.2))) * 90, pw = 360, ph = 740;
  ctx.save(); ctx.translate(px + pw / 2, py + ph / 2); ctx.scale(zoom, zoom); ctx.translate(-(px + pw / 2), -(py + ph / 2));
  ctx.globalAlpha = seg(u, 0, .8);
  ctx.save(); ctx.shadowBlur = 90; ctx.shadowColor = 'rgba(214,181,109,.25)';
  const bg = ctx.createLinearGradient(px, py, px + pw, py + ph); bg.addColorStop(0, '#6d6250'); bg.addColorStop(.5, '#1d1b17'); bg.addColorStop(1, '#8a7a5a');
  rrect(px, py, pw, ph, 58); ctx.fillStyle = bg; ctx.fill(); ctx.restore();
  rrect(px + 6, py + 6, pw - 12, ph - 12, 52); ctx.fillStyle = '#050605'; ctx.fill();
  const x0 = px + 18, y0 = py + 18, sw = pw - 36, sh = ph - 36;
  ctx.save(); rrect(x0, y0, sw, sh, 44); ctx.clip();
  let g = ctx.createLinearGradient(0, y0, 0, y0 + sh); g.addColorStop(0, '#0e1a14'); g.addColorStop(1, '#070b09'); ctx.fillStyle = g; ctx.fillRect(x0, y0, sw, sh);
  rrect(x0 + sw / 2 - 55, y0 + 12, 110, 30, 15); ctx.fillStyle = '#000'; ctx.fill();
  txt('9:41', x0 + 34, y0 + 34, { font: SANS(15, 600) });
  const cx = x0 + sw / 2, post = seg(u, 4.9, 5.4);
  ctx.save(); ctx.globalAlpha *= 1 - post;
  txt('AGROBO', cx, y0 + 98, { font: SERIF(500, 26), color: P.gold, ls: 9, align: 'center' });
  txt('Your farm.', cx, y0 + 168, { font: SERIF(300, 40), align: 'center' });
  txt('Fully autonomous.', cx, y0 + 212, { font: SERIF(300, 40, 1), color: P.gold2, align: 'center' });
  rrect(x0 + 18, y0 + 250, sw - 36, 330, 22); ctx.fillStyle = 'rgba(255,255,255,.04)'; ctx.fill(); ctx.strokeStyle = 'rgba(214,181,109,.35)'; ctx.lineWidth = 1; ctx.stroke();
  txt('AUTONOMOUS FARM PLAN', x0 + 40, y0 + 288, { font: MONO(12, 600), color: P.gold, ls: 2 });
  txt('One monthly subscription', x0 + 40, y0 + 314, { font: SANS(15), color: 'rgba(242,236,223,.6)' });
  const items = ['Land sourcing & acquisition', 'Clearing, tilling, irrigation', 'Planting, scouting, weeding', 'Robotic harvest', 'Grading & cold chain', 'Selling & payouts'];
  items.forEach((s, i) => { const a = seg(u, .9 + i * .28, 1.3 + i * .28); if (!a) return; const yy = y0 + 360 + i * 38;
    ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = P.gold; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(x0 + 50, yy - 5, 9, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x0 + 45, yy - 5); ctx.lineTo(x0 + 49, yy - 1); ctx.lineTo(x0 + 56, yy - 10); ctx.stroke(); ctx.restore();
    txt(s, x0 + 70 + (1 - a) * 10, yy, { font: SANS(15), alpha: a }); });
  const tapped = u > 4.25, by = y0 + 610;
  rrect(x0 + 18, by, sw - 36, 58, 29);
  if (!tapped) { g = ctx.createLinearGradient(x0, by, x0 + sw, by); g.addColorStop(0, '#b8954f'); g.addColorStop(.5, '#f3dea4'); g.addColorStop(1, '#b8954f'); ctx.fillStyle = g; ctx.fill();
    txt('Start my farm', cx, by + 36, { font: SANS(18, 600), color: '#1a1408', align: 'center' }); }
  else { ctx.fillStyle = '#123a2a'; ctx.fill(); ctx.strokeStyle = P.gold; ctx.lineWidth = 1.5; ctx.stroke(); txt('Subscribed  ✓', cx, by + 36, { font: SANS(18, 600), color: P.gold2, align: 'center' }); }
  ctx.restore();
  if (post > 0) { ctx.save(); ctx.globalAlpha *= post; const ry = y0 + 250;
    ctx.strokeStyle = 'rgba(214,181,109,.2)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, ry, 54, 0, 7); ctx.stroke();
    ctx.strokeStyle = P.gold; ctx.beginPath(); ctx.arc(cx, ry, 54, u * 4, u * 4 + 1.6); ctx.stroke();
    txt('Agrobo is on it.', cx, ry + 120, { font: SERIF(300, 34), align: 'center' });
    ['› Scanning 40 parcels', '› Matching soil to crop', '› Forecasting demand', '› Planning the season'].forEach((s, i) => txt(s, x0 + 50, ry + 180 + i * 30, { font: MONO(13), color: P.gold2, alpha: seg(u, 5.5 + i * .35, 5.8 + i * .35) }));
    ctx.restore(); }
  // finger tap
  if (u > 3.3 && u < 5.2) { const fa = seg(u, 3.3, 4.2), fx = lerp(cx + 160, cx + 30, eout(fa)), fy = lerp(by + 210, by + 30, eout(fa));
    if (u < 4.6) glowDot(fx, fy, 34, '#ffffff', .35 * (1 - seg(u, 4.3, 4.6)));
    const rp = seg(u, 4.22, 5.0); if (rp > 0) { ctx.strokeStyle = `rgba(243,222,164,${1 - rp})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx + 30, by + 30, 10 + rp * 120, 0, 7); ctx.stroke(); } }
  ctx.restore(); ctx.restore();
  ctx.globalAlpha = 1 - seg(u, 6.9, 7.6);
  reveal('One subscription.', 1050, 460, u, 1.3, d, { font: SERIF(300, 96) });
  reveal('Everything after this,', 1052, 560, u, 5.0, d, { font: SERIF(300, 54, 1), color: 'rgba(242,236,223,.75)' });
  reveal('Agrobo does.', 1052, 630, u, 5.6, d, { font: SERIF(300, 54, 1), color: P.gold2 });
  ctx.globalAlpha = 1;
}

// S3: sourcing — 40 parcels scored, one acquired
let PARCELS;
const SPOT = S.spot.map((_, i, a) => { const w = a.slice(Math.max(0, i - 3), i + 4); return w.reduce((x, y) => x + y, 0) / w.length; });
function buildParcels() {
  const R = rng(26), cols = 8, rows = 5, x0 = 330, y0 = 260, cw = 222, chh = 176, pts = [];
  for (let j = 0; j <= rows; j++) { pts.push([]); for (let i = 0; i <= cols; i++) pts[j].push([x0 + i * cw + (i && i < cols ? (R() - .5) * 70 : 0), y0 + j * chh + (j && j < rows ? (R() - .5) * 56 : 0)]); }
  const top = {}; S.top5.forEach((t, k) => { top[parseInt(t.parcel.slice(-3)) - 1] = { s: t.suitability, rank: k + 1 }; });
